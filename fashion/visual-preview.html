<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#151816">
<meta name="description" content="KIM JUNSEO 포트폴리오 · 원본 이미지 기반 VOLT-UP, ROUND LAB 인터랙티브 디자인 뷰어">
<title>KIM JUNSEO — Visual Design Experience</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--accent:#c9ed7a;--ground:#151815;--panel:#20231f;--ink:#f8f8ef;--muted:#adb0a7}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--ground);color:var(--ink);font:14px/1.65 "DM Sans","Noto Sans KR",sans-serif}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.top{height:77px;position:sticky;top:0;z-index:8;border-bottom:1px solid #ffffff32;background:#161917f2;backdrop-filter:blur(15px);display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 clamp(20px,4vw,66px)}
.logo{font:800 14px/1.3 "Space Grotesk",sans-serif;letter-spacing:-.02em}.logo small{display:block;color:#b0b1a6;letter-spacing:.14em;font-size:9px;margin-top:4px;font-weight:500}
.back{padding:10px 16px;border-radius:50px;border:1px solid #ffffff60;font-size:11px;font-weight:700;letter-spacing:.06em}
main{max-width:1450px;margin:auto;padding:clamp(35px,5vw,75px) clamp(20px,4vw,66px) 100px}
.kicker{display:block;color:var(--accent);font-size:11px;letter-spacing:.21em;font-weight:800;margin-bottom:20px}
h1{font:700 clamp(50px,10vw,150px)/.98 "Space Grotesk",sans-serif;letter-spacing:-.09em;margin:0 0 22px}
.lead{color:#ced2c5;font-size:clamp(13px,1.35vw,18px);margin:0 0 35px;max-width:760px;word-break:keep-all}
.viewport{border-radius:24px;border:1px solid #ffffff34;background:var(--panel);overflow:hidden;box-shadow:0 22px 80px #0004}
.viewport-head{display:flex;justify-content:space-between;gap:15px;padding:20px 24px;border-bottom:1px solid #ffffff26;align-items:center;font-size:11px;font-weight:700;letter-spacing:.12em}
.viewport-head span:last-child{color:var(--accent)}
.image-stage{min-height: min(75vh,850px);display:flex;align-items:center;justify-content:center;overflow:auto;padding:clamp(15px,3vw,42px);background:radial-gradient(ellipse at 50% 44%,#444936,#1c211d 64%);position:relative}
.image-stage img{display:block;max-width:min(100%,1100px);max-height:min(77vh,850px);width:auto;height:auto;object-fit:contain;box-shadow:0 20px 50px #0005;border-radius:6px}
.image-stage .roundlab-sheet{max-height:none;width:min(100%,760px);max-width:100%;height:auto}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px 24px;flex-wrap:wrap;border-top:1px solid #ffffff26}
.toolbar-left{display:flex;align-items:center;gap:12px}
.control{background:#f5f4e9;color:#1a1c18;border:0;border-radius:50%;width:44px;height:44px;font-size:23px}
.control:hover{background:var(--accent)}
.counter{font:700 14px "Space Grotesk",sans-serif;letter-spacing:.12em}
.caption{color:#c6c8bf;font-size:13px}
.thumbs{display:flex;gap:10px;overflow:auto;padding:18px 24px;border-top:1px solid #ffffff24}
.thumbs button{background:transparent;padding:5px;border-radius:8px;border:2px solid transparent;cursor:pointer;min-width:82px}
.thumbs button.active{border-color:var(--accent)}
.thumbs img{height:94px;width:74px;object-fit:contain;background:#292d28;border-radius:5px}
.note{font-size:12px;color:#a9b0a2;line-height:1.8;margin-top:24px}
.note strong{color:#e1ebce}
.reader-tip{padding:12px 15px;background:#a9d8ee13;color:#d9ecf3;border-radius:9px;font-size:12px;margin-bottom:20px}
button.link{border:1px solid #bfcabb87;background:none;color:#eef0e9;padding:12px 18px;border-radius:50px}
.zoomed .image-stage img{max-height:none;max-width:none;width:min(150%,1450px)}
@media(max-width:690px){.top{height:68px}.viewport-head,.toolbar{padding:15px}.image-stage{min-height:52vh}.image-stage img{max-height:62vh}.thumbs{padding:12px}.thumbs img{height:75px;width:65px}h1{font-size:clamp(43px,13vw,75px)}}
</style></head><body>
<header class="top"><a class="logo" href="./">KIM JUNSEO<small>INTERACTIVE VISUAL SHOWCASE</small></a><a class="back" href="./">← BACK TO PORTFOLIO</a></header>
<main>
<span class="kicker" id="kicker">VISUAL DESIGN / 2026</span><h1 id="title"></h1><p class="lead" id="lead"></p>
<div class="reader-tip" id="hint"></div>
<section class="viewport" id="viewport" aria-label="실제 디자인 원본 이미지 뷰어">
<div class="viewport-head"><span id="section-title"></span><span id="mode"></span></div>
<div class="image-stage" id="stage"><img id="art" alt="" decoding="async"></div>
<div class="toolbar"><div class="toolbar-left"><button class="control" id="prev" type="button" aria-label="이전 이미지">‹</button><span class="counter" id="counter"></span><button class="control" id="next" type="button" aria-label="다음 이미지">›</button></div>
<span class="caption" id="caption"></span><button class="link" id="zoom" type="button">이미지 확대</button></div>
<div class="thumbs" id="thumbs" aria-label="이미지 선택"></div>
</section>
<p class="note"><strong>사용한 이미지는 실제 제작한 디자인 원본입니다.</strong> 이 페이지는 정적 비주얼 작업을 탐색하는 뷰어이며, 별도의 앱이 제작된 것처럼 표시하지 않습니다.</p>
</main>
<script>
(()=>{
const data={
voltup:{title:"VOLT-UP",kicker:"ORIGINAL BRAND / VISUAL CAMPAIGN",accent:"#d0ec73",lead:"운동 전 10초, 텐션을 깨우는 나만의 에너지 브랜드. 첫 번째 카드뉴스 10장을 순서대로 넘겨보세요.",hint:"키보드 ← →, 버튼, 모바일 좌우 스와이프로 10장의 카드뉴스를 감상할 수 있습니다.",mode:"CARD NEWS 01 / 10 SCREENS",pictures:[["./assets/voltup/cardnews-01/01.webp","피곤한 현대인의 하루"],["./assets/voltup/cardnews-01/02.webp","자도 자도 피곤한 아침"],["./assets/voltup/cardnews-01/03.webp","기상 직후의 피로감"],["./assets/voltup/cardnews-01/04.webp","커피만으로 부족한 집중"],["./assets/voltup/cardnews-01/05.webp","퇴근 후 지친 일상"],["./assets/voltup/cardnews-01/06.webp","운동도 공부도 미루는 하루"],["./assets/voltup/cardnews-01/07.webp","하루 종일 부족한 에너지"],["./assets/voltup/cardnews-01/08.webp","운동 전 에너지 부스터"],["./assets/voltup/cardnews-01/09.webp","VOLT-UP 캠페인 키비주얼"],["./assets/voltup/cardnews-01/10.webp","브랜드 메시지와 혜택"]]},
roundlab:{title:"ROUND LAB",kicker:"PRODUCT DETAIL / VISUAL DESIGN",accent:"#a6dff0",lead:"Round Lab Birch Juice Moisturizing Sunscreen. 수분감과 산뜻함을 표현한 실제 상세페이지 디자인을 원본 비율로 살펴보세요.",hint:"원본 디자인을 세로로 스크롤하고, 확대 버튼으로 디테일을 확인할 수 있습니다.",mode:"SCROLL / PRODUCT DETAIL",pictures:[
["./assets/figma-original/roundlab-figma-hires.png","자작나무 수분 선크림 상세페이지"],
["./assets/submitted/roundlab-poster.webp","상세페이지 대표 이미지"],
["./assets/work-roundlab-screen.png","제품 디자인 화면"]
]}
};
const query=new URLSearchParams(location.search),id=query.get("project")==="roundlab"?"roundlab":"voltup",d=data[id];
document.title=d.title+" — KIM JUNSEO VISUAL EXPERIENCE";
document.documentElement.style.setProperty("--accent",d.accent);
const $=x=>document.getElementById(x);$("title").textContent=d.title;$("kicker").textContent=d.kicker;
$("lead").textContent=d.lead;$("hint").textContent=d.hint;$("section-title").textContent=d.title+" / ORIGINAL DESIGN";$("mode").textContent=d.mode;
let current=0,startX=null;
function show(n){
 current=(n+d.pictures.length)%d.pictures.length;
 const [src,label]=d.pictures[current];$("art").src=src;$("art").alt=d.title+": "+label;
 $("art").classList.toggle("roundlab-sheet",id==="roundlab"&&current===0);
 $("counter").textContent=String(current+1).padStart(2,"0")+" / "+String(d.pictures.length).padStart(2,"0");
 $("caption").textContent=label;
 $("viewport").classList.remove("zoomed");$("zoom").textContent="이미지 확대";
 for(const [i,button] of Array.from($("thumbs").children).entries()){button.classList.toggle("active",i===current);button.setAttribute("aria-current",i===current?"true":"false");}
}
for(let i=0;i<d.pictures.length;i++){
 const btn=document.createElement("button");btn.type="button";btn.setAttribute("aria-label",(i+1)+"번째 디자인 보기");
 btn.innerHTML='<img alt="" loading="lazy" src="'+d.pictures[i][0]+'">';
 btn.addEventListener("click",()=>show(i));$("thumbs").appendChild(btn);
}
$("prev").addEventListener("click",()=>show(current-1));$("next").addEventListener("click",()=>show(current+1));
$("zoom").addEventListener("click",()=>{const state=$("viewport").classList.toggle("zoomed");$("zoom").textContent=state?"원래 크기":"이미지 확대";});
window.addEventListener("keydown",e=>{if(e.key==="ArrowLeft")show(current-1);else if(e.key==="ArrowRight")show(current+1);});
$("stage").addEventListener("touchstart",e=>{startX=e.touches[0]?.clientX??null;},{passive:true});
$("stage").addEventListener("touchend",e=>{if(startX===null)return;const diff=(e.changedTouches[0]?.clientX??startX)-startX;if(Math.abs(diff)>70)show(current+(diff<0?1:-1));startX=null;},{passive:true});
show(0);
})();
</script></body></html>
