<!doctype html><html><head><meta charset="utf-8"><title>Portfolio media diagnostics</title><style>body{font:16px monospace;background:#121821;color:white;padding:30px}pre{white-space:pre-wrap;line-height:1.7}video{width:400px;max-width:100%}</style></head><body><h1>Portfolio media diagnostics</h1><pre id="out">Checking URLs and video decode...</pre><video id="player" muted controls playsinline preload="metadata"></video><script>
(async function(){const out=document.querySelector('#out'),p=document.querySelector('#player'),names=['lostlink','soundcloud','junggonara','ppomppu','roundlab'];let result=[];
for(const name of names){for(const ext of ['webm','mp4']){const url='./assets/demos/'+name+'.'+ext;let status='unknown',type='',err='',duration='-';try{const r=await fetch(url,{method:'HEAD',cache:'no-store'});status=r.status;type=r.headers.get('content-type');}catch(e){err='HEAD '+e.message;}const v=document.createElement('video');v.preload='metadata';v.muted=true;v.src=url;await new Promise(resolve=>{let done=false;function finish(){if(done)return;done=true;clearTimeout(t);resolve();}v.addEventListener('loadedmetadata',()=>{duration=v.duration;finish()},{once:true});v.addEventListener('error',()=>{err+=' video.error='+ (v.error?v.error.code:'unknown');finish()},{once:true});const t=setTimeout(()=>{err+=' timeout';finish()},4500);});result.push({name,ext,status,type,canPlay:v.canPlayType('video/'+ext),readyState:v.readyState,networkState:v.networkState,duration,error:err});out.textContent=JSON.stringify(result,null,2);v.removeAttribute('src');v.load();}}
p.src='./assets/demos/lostlink.webm';p.play().then(()=>out.textContent+='\n\nINLINE LOSTLINK PLAY SUCCESS').catch(e=>out.textContent+='\n\nINLINE PLAY ERROR '+e.name+':'+e.message);
})();
</script></body></html>
