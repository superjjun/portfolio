<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0a0b">
  <meta name="description" content="HIDDEN STAGE — 새로운 음악을 발견하고, 아티스트의 첫 번째 팬이 되는 SoundCloud 참여형 리디자인 프로젝트.">
  <meta property="og:title" content="HIDDEN STAGE — SoundCloud Reimagined">
  <meta property="og:description" content="Discover first. Listen deeper. Lift artists higher.">
  <meta property="og:type" content="website">
  <title>HIDDEN STAGE — SoundCloud Reimagined</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div id="app" class="app">
    <aside class="sidebar" id="sidebar" aria-label="메인 탐색"></aside>
    <div class="workspace" id="workspace">
      <header class="topbar" id="topbar"></header>
      <div class="body-grid">
        <main class="main" id="main" tabindex="-1"></main>
        <aside class="rail" id="rail" aria-label="커뮤니티 소식"></aside>
      </div>
      <footer class="site-footer"><span>HIDDEN STAGE / SOUNDCLOUD REDESIGN</span><span>DESIGNED FOR DISCOVERY · KIM JUNSEO © 2026</span></footer>
    </div>
    <div id="player" class="player" aria-label="음악 미리듣기"></div>
    <nav id="mobile-nav" class="mobile-nav" aria-label="모바일 탐색"></nav>
    <div id="modal-root"></div>
    <div id="toast" role="status" aria-live="polite" class="toast" aria-atomic="true"></div>
  </div>
  <noscript><div class="noscript">이 웹앱은 JavaScript를 사용합니다. JavaScript를 활성화해 주세요.</div></noscript>
</body>
</html>
