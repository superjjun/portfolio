:root{
  --bg:#090e19;--bg2:#0c1321;--surface:#141e31;--surface2:#1a2942;
  --stroke:#293850;--ink:#f2f5fc;--sub:#a0acc2;--faint:#72849d;
  --blue:#5c7aff;--blue-soft:#a9baff;--green:#59d1a4
}
html{background:#080b12}
body{background:radial-gradient(ellipse 55% 75% at 54% 47%,#152440 0%,#0a101b 55%,#080c13 100%);color:var(--ink);letter-spacing:-.015em}
.backdrop{gap:clamp(45px,6vw,110px);padding:30px 28px;min-height:100dvh}
.outside{width:245px;color:#f0f2f7}
.outside .sm{color:#8499d7;font-weight:700;font-size:10px;letter-spacing:.20em}
.outside h1{font-size:clamp(39px,4vw,56px);font-weight:700;line-height:1.12;letter-spacing:-.065em;color:#ecf0fc;margin:23px 0}
.outside p{font-size:12px;color:#9eacc7;line-height:2}
.outside .small{font-size:9px;line-height:2.1;color:#7787a2;letter-spacing:.045em}
.phone{width:390px;height:min(844px,calc(100dvh - 54px));background:#090e19;border:1px solid #33435a;border-radius:31px;box-shadow:0 38px 100px rgba(0,0,0,.56),0 0 0 7px rgba(17,24,37,.70);overflow:hidden}
.scroller{inset:0 0 78px;scroll-behavior:smooth;background:linear-gradient(180deg,#0b111e 0%,#090e19 45%,#090e19 100%)}
.status{height:53px;padding:17px 24px 6px;font-size:13px;color:#e9ecf7}
.status .symbols{gap:6px}
.top{padding:12px 23px 0}
.logo{font-size:27px;font-weight:800;letter-spacing:-.07em;line-height:1.1}
.logo b{color:#6b88ff}
.circle-btn{height:37px;width:37px;border:1px solid #293a54;background:#172238;color:#b5c8e9;border-radius:12px;transition:background .18s,border-color .18s}
.circle-btn:hover{background:#233551;border-color:#546da0}
.tagline{margin:12px 23px 0;font-size:11px;line-height:1.8;color:#97a8c1}
.home-main{padding:43px 21px 28px}
.section-title{font-size:23px;letter-spacing:-.055em;line-height:1.35;margin:0 0 24px;font-weight:750}
.actions{gap:10px}
.action{height:151px;border-radius:18px;padding:18px;border-color:#6987ff;background:linear-gradient(145deg,#627ffb 0%,#456be9 100%);box-shadow:inset 0 1px 0 #ffffff30;transition:transform .2s,border-color .2s,filter .2s}
.action:hover{transform:translateY(-2px);filter:brightness(1.035)}
.action:active{transform:scale(.986)}
.action.found{background:linear-gradient(145deg,#19283f,#111c2d);border:1px solid #31435f;box-shadow:inset 0 1px 0 #ffffff09}
.action-illustration{top:17px;right:18px;color:#fff}
.action .action-illustration svg{width:30px;height:30px;stroke-width:1.7}
.action.found .action-illustration{color:#73d7d9}
.action h3{font-size:16px;margin-bottom:9px;letter-spacing:-.045em;font-weight:700}
.action span:not(.action-illustration){font-size:10px;font-weight:500;line-height:1.5;color:#f4f6ff}
.action.found span:not(.action-illustration){color:#a3b3cc}
.section-row{margin:37px 1px 16px;align-items:center}
.section-row h2{font-size:17px;letter-spacing:-.035em;font-weight:700}
.arrowtext{font-size:10px;color:#aabaf5;gap:4px;padding:7px 2px}
.arrowtext svg{height:13px;width:13px}
.match-card{border-radius:17px;background:#131f33;border:1px solid #30435c;padding:14px;gap:16px;min-height:125px;transition:border-color .2s,background .2s}
.match-card:hover{background:#192941;border-color:#6580d4}
.match-card .match-photo{height:95px;width:95px;border:1px solid #26354a;border-radius:12px;object-fit:contain}
.match-main{display:flex;flex-direction:column;justify-content:center}
.similar{font-size:27px;letter-spacing:-.055em;color:#61dcae;line-height:1}
.similar span{color:#7cd5bb;font-weight:600;font-size:10px;vertical-align:middle}
.match-main b{font-size:15px;font-weight:700;letter-spacing:-.035em;margin-top:14px}
.match-main small{font-size:10px;color:#9caac4;margin-top:8px;line-height:1.5}
.notice{display:none}
.feed{padding:33px 21px 55px;background:#0a101b;border-top:1px solid #1d2b3f}
.feed-header{align-items:center;margin:0 0 11px}
.feed-header h2{font-size:19px;line-height:1.3;font-weight:750}
.live{font-size:9px;color:#6fd6ae}
.live i{width:5px;height:5px;background:#57d9ad}
.lead{font-size:11px;line-height:1.7;margin:0 0 20px;color:#96a8c3}
.found-list,.explore-feed{gap:10px}
.item{min-height:111px;padding:12px;gap:14px;background:#131e31;border-color:#2b3c55;border-radius:16px;transition:background .2s,border-color .2s,transform .2s}
.item:hover{background:#1b2a42;border-color:#607dc6;transform:translateY(-1px)}
.item:active{transform:scale(.991)}
.item .photo{width:86px;height:86px;border-radius:11px;background:#0a111e;border:1px solid #293a53;object-fit:contain}
.item-copy{display:flex;flex-direction:column;justify-content:center;min-width:0;gap:5px}
.item-kind{font-size:10px;color:#8da7fd;font-weight:600;letter-spacing:0;line-height:1.3}
.item-name{font-size:14px;font-weight:700;margin:0 0 2px;letter-spacing:-.03em;line-height:1.45}
.item-place,.item-time{font-size:10px;line-height:1.4;color:#a1b0c8;gap:6px;margin:0}
.item-place svg,.item-time svg{flex:0 0 12px;stroke-width:1.7}
.item-time{color:#8398bc}
.item-arrow{color:#7c91b5;font-size:21px;padding-right:1px}
.bottom{height:78px;background:rgba(9,14,25,.965);border-top:1px solid #26344b;backdrop-filter:blur(18px);padding:9px 9px 10px;box-shadow:0 -8px 30px rgba(0,0,0,.12)}
.bottom button{position:relative;gap:6px;font-size:10px;color:#8d9db7;font-weight:600;justify-content:center;transition:color .2s}
.bottom button svg{height:21px;width:21px;stroke-width:1.8}
.bottom button.current{color:#83a0ff}
.bottom button.current::before{content:"";position:absolute;top:-9px;width:25px;height:2px;border-radius:99px;background:#6482ff}
.bottom button:not(.current):hover{color:#c9d5ed}
.page{padding:0 21px 44px}
.page-bar{height:67px}
.page-bar strong{font-size:17px;font-weight:700}
.explore-page,.alerts-page{padding-bottom:55px}
.explore-heading{font-size:23px;line-height:1.32;letter-spacing:-.055em;margin:18px 0 9px;font-weight:750}
.explore-sub{font-size:11px;line-height:1.8;margin:0 0 22px;color:#9eacc2}
.explore-search{height:53px;background:#19263d;border:1px solid #354969;border-radius:13px;padding:0 14px;gap:11px;color:#9db6ff;transition:border-color .2s,box-shadow .2s}
.explore-search:focus-within{border-color:#7491ff;box-shadow:0 0 0 3px rgba(92,122,255,.14)}
.explore-search input{font-size:12px;line-height:1.5;color:#f5f7ff;font-weight:500}
.explore-search input::placeholder{color:#8c9eba}
.explore-search button{font-size:22px;color:#afc2ff}
.explore-chips{gap:8px;margin-top:14px;padding-bottom:3px}
.explore-chips button{border-radius:9px;background:#152238;border:1px solid #30425b;color:#bac7dc;padding:10px 15px;font-size:11px;font-weight:600}
.explore-chips button.chosen{background:#263c75;border-color:#5f7df0;color:#dce6ff}
.explore-head{margin:29px 0 14px}
.explore-head strong{font-size:15px;font-weight:750;letter-spacing:-.035em}
.explore-head span{font-size:10px;color:#7e93b1}
.explore-feed{display:flex;flex-direction:column}
.explore-feed .item{min-height:111px}
.explore-demo{font-size:10px;line-height:1.8;color:#7b90ad;margin-top:20px}
.alert-entries{gap:12px;margin-top:26px}
.alert-entries button{padding:20px 17px;background:#141f32;border-color:#2f405a;border-radius:15px;gap:10px;transition:border-color .2s}
.alert-entries button:hover{border-color:#6180d5}
.alert-entries button b{font-size:14px}
.alert-entries button span{font-size:11px;line-height:1.8}
.alert-entries button small{color:#76d8b3}
.hero-photo,.zoom-hit{border-radius:16px;background:#0a111c}
.details-list{border-color:#293951}
.detail-line{border-color:#25344b;padding:16px 0}
.detail-description{color:#b2c1d5}
.primary{border-radius:12px;background:#5b79f7;font-weight:700;box-shadow:0 6px 18px rgba(63,100,241,.14)}
.primary:hover{filter:brightness(1.07)}
.secondary{border-radius:12px;background:#1c2a42;border-color:#344a67}
.field{gap:9px;margin:20px 0}
.field label{color:#dce5f8}
.field input,.field select,.field textarea{border-radius:12px;border:1px solid #354860;background:#16233a}
.field input:focus,.field textarea:focus{border-color:#6b8afb}
.type{border-radius:10px;background:#18263d}
.type.selected{background:#2b427e}
.address-launch{border-radius:11px;background:#1c2d4c;border-color:#4669c6;color:#cdd9ff;font-size:11px;min-height:43px}
.sheet{background:#121e30;border-color:#364962;border-radius:20px}
.phone #overlay{position:absolute;inset:0;z-index:60;pointer-events:none}
.phone #overlay:not(:empty){pointer-events:auto}
.phone #overlay .sheet-wrap,.phone #overlay .gallery{position:absolute;inset:0}
.phone #overlay .sheet-wrap{align-items:flex-end;padding:0;background:rgba(1,5,12,.77)}
.phone #overlay .sheet{width:100%;border-left:0;border-right:0;border-bottom:0;border-radius:22px 22px 0 0;max-height:90%;overflow-y:auto;padding:24px 22px}
.phone #overlay .gallery{justify-content:center;background:#000d}
.phone #overlay .gallery img{max-width:92%;max-height:70%}
.phone #overlay .road-sheet{width:100%;max-width:none;height:94%;max-height:none;border:1px solid #35445a;border-bottom:0;border-radius:24px 24px 0 0;box-shadow:0 -15px 55px rgba(0,0,0,.26)}
.phone #overlay .road-head{height:58px;background:#101c30;border-bottom:1px solid #31435a}
.phone #overlay .road-head strong{font-size:13px}
.phone #overlay .road-iframe{background:#0a1020}
@media(max-width:780px){
 html,body{background:#090e19}
 .backdrop{padding:0;min-height:100dvh}
 .phone{height:100dvh;width:100%;max-width:none;border:0;border-radius:0;box-shadow:none}
 .bottom{height:calc(74px + env(safe-area-inset-bottom));padding-bottom:max(7px,env(safe-area-inset-bottom))}
 .scroller{bottom:calc(74px + env(safe-area-inset-bottom))}
 .phone #overlay .road-sheet{height:94dvh}
}
@media(max-width:360px){
 .home-main,.feed,.page{padding-left:17px;padding-right:17px}
 .top{padding-left:19px;padding-right:19px}
 .action{padding:14px;height:145px}
 .action h3{font-size:15px}
 .item{gap:10px}
 .item .photo{width:75px;height:75px}
}
@media(prefers-reduced-motion:reduce){.action,.item,.bottom button{transition:none!important}}

function savedView(){return status()+'<section class="page"><div class="page-bar"><strong>보관함</strong><button class="circle-btn" data-route="home">'+svg('home',18)+'</button></div><div class="eyebrow">MY LOST LINK</div><h1 class="section-title" style="margin:15px 0">관심 있는 습득물</h1><p class="form-intro">상세 화면에서 저장한 물건을 여기에서 확인할 수 있어요.</p><div class="stack">'+(ALL_ITEMS.filter(function(d){return saved.has(d.id)}).map(row).join('')||'<div class="empty">아직 저장한 습득물이 없어요.<br>발견물 상세 화면에서 ♡ 저장을 눌러 보세요.</div>')+'</div><button class="secondary" data-route="home">최근 발견물 둘러보기</button></section>'}
function verifiedView(){var d=getItem(state.verifiedId);if(!d)return matches();var air=d.id===0;return status()+'<section class="page verified-page"><div class="page-bar"><strong>LOST LINK</strong><button class="circle-btn" data-route="saved">'+svg('archive',18)+'</button></div><div class="verified-badge">MATCHED</div><h1 class="verified-heading">분실물을 찾았습니다.</h1><p class="form-intro">등록 정보와 습득물 특징을 비교한 결과입니다.</p><div class="verified-card"><div class="verified-hero"><div><h2>'+escapeHtml(d.name)+'</h2><div class="verified-green">습득자 확인 완료 · 시연</div></div><div class="verified-score"><span>MATCH SCORE</span><strong>'+(air?'93%':'일치')+'</strong></div></div><div class="verified-track"><span></span></div><p class="verified-caption">높은 일치 확률 · 시연용 확인 상태</p></div><h2 class="verified-section">일치한 정보</h2><div class="verified-metrics"><div><small>제품·형태</small><b>'+(air?'99%':'일치')+'</b></div><div><small>분실 위치</small><b>'+(air?'97%':'일치')+'</b></div><div><small>분실 시간</small><b>'+(air?'92%':'일치')+'</b></div></div><h2 class="verified-section">결정적 특징</h2><div class="verified-features"><b>확인된 물건 특징</b><p>'+escapeHtml(d.description)+'</p><span>'+escapeHtml(d.where)+'</span></div><div class="verified-actions"><button class="secondary" data-route="saved">보관함에서 확인</button><button class="primary" data-chat-confirmed="1">습득자와 채팅하기</button></div><p class="footnote">※ 실제 습득자의 응답·본인 인증이 아닌 시뮬레이션 결과입니다. 채팅은 데모입니다.</p></section>'}
function syncHash(){var h=decodeURIComponent(location.hash.substring(1));if(h.indexOf('item-')===0){state.page='detail';state.id=Math.min(ALL_ITEMS.length-1,Math.max(0,Number(h.slice(5))||0))}else if(h==='matches'){state.page='matches'}else if(h==='explore'){state.page='explore'}else if(h==='alerts'){state.page='alerts'}else if(h==='verified'){state.page=state.verifiedId!==null?'verified':'matches'}else if(h==='saved'){state.page='saved'}else if(h==='register-lost'){state.page='register';state.mode='lost'}else if(h==='register-found'){state.page='register';state.mode='found'}else{state.page='home'}}
function route(page,id,replace){if(state.page==='home')state.homeScroll=screen.scrollTop;if(page==='verified'&&state.verifiedId===null)page='matches';state.page=page;if(typeof id==='number')state.id=id;if(page==='register')state.success=false;var h=page==='home'?'':page==='detail'?'item-'+state.id:page==='register'?'register-'+state.mode:page;var url=location.pathname+location.search+(h?'#'+h:'');if(replace)history.replaceState({},'',url);else history.pushState({},'',url);render()}
function render(){var content=state.page==='detail'?detail(getItem(state.id)):state.page==='matches'?matches():state.page==='explore'?explore():state.page==='alerts'?alerts():state.page==='verified'&&state.verifiedId!==null?verifiedView():state.page==='register'?register():state.page==='saved'?savedView():home();screen.innerHTML=content;nav();bindPhotos();screen.scrollTop=state.page==='home'?state.homeScroll:0}
function updateSaved(id){if(saved.has(id))saved.delete(id);else saved.add(id);try{localStorage.setItem('lostlink-saved-v1',JSON.stringify([...saved]))}catch(e){}render()}
function sheet(id){state.pendingId=id;var d=getItem(id);overlay.innerHTML='<div class="sheet-wrap" data-dismiss="1"><div class="sheet" role="dialog" aria-modal="true" aria-label="확인 요청"><h3>확인 요청 보내기</h3><p><b>'+escapeHtml(d.name)+'</b>이(가) 내 물건이 맞나요?<br>장소·시간·특징을 확인해 주세요.<br><br>본 기능은 프로토타입이며 실제 습득자에게 전송되지 않습니다.</p><button class="primary" data-confirm="1">확인 요청 보내기</button><button class="secondary" data-close="1">취소</button></div></div>'}
function noticeToast(){overlay.innerHTML='<div class="sheet-wrap" data-dismiss="1"><div class="sheet"><h3>확인 요청을 보냈습니다 ✓</h3><p>습득자가 특징을 확인하고 일치함을 인정하기 전에는 채팅을 시작할 수 없습니다.</p><p class="demo-verification-note">현재는 포트폴리오 프로토타입입니다. 아래 버튼을 누르면 실제 응답 없이 확인 완료 상태를 <b>가상으로 체험</b>합니다.</p><button class="primary" data-demo-verify="1">습득자 확인 완료 체험하기</button><button class="secondary" data-close="1">답변 기다리기</button></div></div>'}
function zoom(d){overlay.innerHTML='<div class="gallery" data-dismiss="1" role="dialog" aria-modal="true" aria-label="'+escapeHtml(d.name)+' 확대 사진"><img class="gallery-image" alt="'+escapeHtml(d.name)+' 큰 사진" src="'+escapeHtml(d.image)+'"><button type="button" data-close="1">사진 닫기 ✕</button></div>';var image=overlay.querySelector('.gallery-image');image.addEventListener('error',function(){if(image.dataset.recovered)return;image.dataset.recovered='1';image.src=fallback(d.shape)});if(image.complete&&!image.naturalWidth)image.dispatchEvent(new Event('error'))}
document.addEventListener('click',function(e){var el=e.target.closest('[data-item],[data-filter],[data-form],[data-route],[data-back],[data-nav],[data-type],[data-save],[data-request],[data-demo-verify],[data-chat-confirmed],[data-address-search],[data-explore-term],[data-explore-clear],[data-close],[data-confirm],[data-zoom],[data-dismiss]');if(!el)return;
if(el.hasAttribute('data-dismiss')&&e.target===el){overlay.innerHTML='';return}
if(el.hasAttribute('data-close')){overlay.innerHTML='';return}
if(el.hasAttribute('data-confirm')){noticeToast();return}
if(el.hasAttribute('data-demo-verify')){if(state.pendingId===null)return;state.verifiedId=state.pendingId;state.pendingId=null;overlay.innerHTML='';route('verified',state.verifiedId);return}
if(el.hasAttribute('data-explore-term')){state.exploreQuery=el.dataset.exploreTerm;route('explore');return}
if(el.hasAttribute('data-explore-clear')){state.exploreQuery='';route('explore');return}
if(el.hasAttribute('data-item')){route('detail',Number(el.dataset.item));return}
if(el.hasAttribute('data-zoom')){zoom(getItem(Number(el.dataset.zoom)));return}
if(el.hasAttribute('data-request')){sheet(Number(el.dataset.request));return}
if(el.hasAttribute('data-chat-confirmed')){if(state.page!=='verified'||state.verifiedId===null)return;var d=getItem(state.verifiedId);var qp=new URLSearchParams({item:String(d.id),name:d.name,place:d.where,feature:d.description});window.open('chat/?'+qp.toString(),'_blank','noopener,noreferrer');return}
if(el.hasAttribute('data-address-search')){overlay.innerHTML='<div class="sheet-wrap" data-dismiss="1"><div class="road-sheet" role="dialog" aria-modal="true" aria-label="도로명 주소 검색"><div class="road-head"><strong>전국 도로명 주소 검색</strong><button type="button" data-close="1">닫기 ✕</button></div><iframe class="road-iframe" src="address/?embed=1" title="도로명 주소 검색"></iframe></div></div>';return}
if(el.hasAttribute('data-save')){updateSaved(Number(el.dataset.save));return}
if(el.hasAttribute('data-type')){state.type=el.dataset.type;document.querySelectorAll('[data-type]').forEach(function(b){b.classList.toggle('selected',b.dataset.type===state.type)});return}
if(el.hasAttribute('data-filter')){var at=screen.scrollTop;state.filter=el.dataset.filter;render();screen.scrollTop=at;return}
if(el.hasAttribute('data-form')){state.mode=el.dataset.form;route('register');return}
if(el.hasAttribute('data-nav')){if(el.dataset.nav==='register')state.mode='found';route(el.dataset.nav);return}
if(el.hasAttribute('data-route')){route(el.dataset.route);return}
if(el.hasAttribute('data-back')){route(el.dataset.back==='explore'?'explore':'home');return}
});
window.addEventListener('message',function(e){if(e.origin!==location.origin||!e.data||e.data.type!=='lostlink:selected-address')return;var iframe=overlay.querySelector('.road-iframe');if(!iframe||e.source!==iframe.contentWindow)return;state.selectedPlace=String(e.data.address||'').slice(0,260);var place=document.getElementById('place');if(place){place.value=state.selectedPlace;place.dispatchEvent(new Event('input',{bubbles:true}))}try{sessionStorage.setItem('lostlink:selected-address',JSON.stringify(e.data))}catch(err){}overlay.innerHTML=''});
document.addEventListener('input',function(e){if(e.target.id==='place')state.selectedPlace=e.target.value;if(e.target.id==='exploreSearch'){state.exploreQuery=e.target.value;var items=exploreFind(state.exploreQuery),count=document.getElementById('exploreCount'),target=document.getElementById('exploreResults');if(count)count.textContent=(state.exploreQuery.trim()?'검색 결과 ':'최근 발견된 습득물 ')+items.length+'건';if(target)target.innerHTML=items.map(row).join('')||'<div class="empty">검색 결과가 없습니다.<br>다른 물건명이나 장소로 검색해 보세요.</div>';document.querySelectorAll('.explore-chips button').forEach(function(b){b.classList.toggle('chosen',b.dataset.exploreTerm===state.exploreQuery)})}if(e.target.id==='matchSearch'){state.query=e.target.value;var results=DATA.filter(function(d){return !state.query||[d.name,d.where,d.category].join(' ').toLowerCase().indexOf(state.query.toLowerCase())>=0});document.getElementById('matchResults').innerHTML=results.map(row).join('')||'<div class="empty">검색 결과가 없습니다.</div>'}if(e.target.id==='pic'&&e.target.files&&e.target.files[0]){var url=URL.createObjectURL(e.target.files[0]);document.getElementById('preview').innerHTML='<img alt="선택한 사진 미리보기" src="'+url+'" style="width:100%;max-height:180px;object-fit:contain;border-radius:12px;background:#1a2b42">'}});
document.addEventListener('submit',function(e){if(e.target.id==='reportForm'){e.preventDefault();if(!e.target.reportValidity())return;state.success=true;render()}});
window.addEventListener('popstate',function(){syncHash();render()});
document.addEventListener('keydown',function(e){if(e.key==='Escape')overlay.innerHTML=''});
syncHash();render();
})();
</script>
</body>
</html>
