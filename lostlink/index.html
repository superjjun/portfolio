function row(d){return '<button class="item" data-item="'+d.id+'">'+photo(d,'')+'<span class="item-copy"><span class="item-kind">'+escapeHtml(d.category)+'</span><strong class="item-name">'+escapeHtml(d.name)+'</strong><span class="item-place">'+svg('pin',12)+escapeHtml(d.where)+'</span><span class="item-time">'+svg('clock',12)+escapeHtml(d.when)+' 발견</span></span><span class="item-arrow">›</span></button>'}
function feedMarkup(){var list=DATA.filter(function(x){return state.filter==='전체'||x.type===state.filter}).filter(function(x){return !state.query||[x.name,x.where,x.category].join(' ').toLowerCase().indexOf(state.query.toLowerCase())>=0});return '<div class="found-list">'+(list.length?list.map(row).join(''):'<div class="empty">일치하는 습득물이 없어요.<br>다른 종류를 선택해 보세요.</div>')+'</div>'}
function home(){return status()+'<header class="top"><div class="logo">LOST <b>LINK</b></div><button class="circle-btn" data-route="saved" aria-label="내 보관함">'+svg('archive',17)+'</button></header><p class="tagline">분실물과 습득물을 한곳에서 확인하세요.</p><section class="home-main"><h1 class="section-title">어떤 일이 있었나요?</h1><div class="actions"><button class="action" data-form="lost"><span class="action-illustration">'+svg('search',44)+'</span><h3>잃어버렸어요</h3><span>분실 신고하고 찾기</span></button><button class="action found" data-form="found"><span class="action-illustration">'+svg('package',44)+'</span><h3>주웠어요</h3><span>사진으로 빠르게 등록</span></button></div><div class="section-row"><h2>최근 매칭 결과</h2><button class="arrowtext" data-route="matches">전체 보기 '+svg('arrow',15)+'</button></div><button class="match-card" data-item="0">'+photo(DATA[0],'match-photo')+'<span class="match-main"><strong class="similar">93% <span>유사도</span></strong><b>AirPods Pro</b><small>홍대입구역 · 어제 18:42</small></span></button><div class="notice"><strong>새로 찾은 습득물</strong><p>조건이 비슷한 습득물을 확인해 보세요.</p></div></section><section class="feed" id="feed"><div class="eyebrow">FOUND NEAR YOU / LIVE FEED</div><div class="feed-header"><h2>최근 발견된 분실물</h2><span class="live"><i></i>NEW</span></div><p class="lead">방금 등록된 습득물을 확인해 보세요.</p><div class="filters">'+['전체','전자기기','패션·소품'].map(function(v){return '<button class="chip '+(state.filter===v?'active':'')+'" data-filter="'+v+'">'+v+'</button>'}).join('')+'</div><div id="feedResults">'+feedMarkup()+'</div><p class="footnote">발견 시간·장소 및 사진은 인터랙션 시연용 예시입니다.<br>실제 분실물 데이터나 실시간 신고 내역은 아닙니다.</p></section>'}
function detail(d){return status()+'<article class="page detail"><div class="page-bar"><button class="back" data-back="home">'+svg('chevron',18)+' 목록</button><strong>습득물 상세</strong><button class="saved-button '+(saved.has(d.id)?'on':'')+'" data-save="'+d.id+'">'+(saved.has(d.id)?'♥ 저장됨':'♡ 저장')+'</button></div><p class="detail-kicker">FOUND / '+escapeHtml(d.category.toUpperCase())+'</p><img class="hero-photo photo" src="'+escapeHtml(d.image)+'" data-shape="'+escapeHtml(d.shape)+'" data-zoom="'+d.id+'" alt="'+escapeHtml(d.name)+' 이미지 확대" loading="eager"><p class="gallery-hint">사진을 누르면 크게 볼 수 있어요</p><h1>'+escapeHtml(d.name)+'</h1><span class="time-badge">'+svg('clock',15)+escapeHtml(d.when)+' 발견</span><div class="details-list"><div class="detail-line"><span>습득 장소</span><b>'+escapeHtml(d.where)+'</b></div><div class="detail-line"><span>습득 시간</span><b>'+escapeHtml(d.when)+'</b></div><div class="detail-line"><span>물건 종류</span><b>'+escapeHtml(d.category)+'</b></div></div><p class="detail-description">'+escapeHtml(d.description)+'<br>분실물 확인을 위해 구체적인 특징을 비교해 보세요.</p><button class="primary" data-request="'+d.id+'">내 물건인가요? 확인 요청 '+svg('arrow',17)+'</button><button class="secondary" data-back="home">발견 목록으로 돌아가기</button><p class="footnote">사진: '+escapeHtml(d.credit)+'<br>포트폴리오 시연용 참고 사진 · 실제 습득물 아님</p></article>'}
function matches(){return status()+'<section class="page"><div class="page-bar"><strong>매칭</strong><button class="circle-btn" data-route="home">'+svg('home',18)+'</button></div><div class="eyebrow">LOST LINK / MATCHES</div><h1 class="section-title" style="margin-top:12px">내 물건과 비슷한<br>습득물 찾기</h1><p class="form-intro">분실 신고를 바탕으로 유사한 물건을 확인해 보세요.</p><div class="search">'+svg('search',18)+'<input id="matchSearch" type="search" aria-label="습득물 검색" placeholder="물건 또는 발견 장소 검색" value="'+escapeHtml(state.query)+'"></div><div id="matchResults">'+DATA.filter(function(d){return !state.query||[d.name,d.where,d.category].join(' ').toLowerCase().indexOf(state.query.toLowerCase())>=0}).map(row).join('')+'</div><button class="primary" data-form="lost">새 분실물 신고하기 '+svg('add',18)+'</button></section>'}
function register(){var isFound=state.mode==='found';return status()+'<section class="page"><div class="page-bar"><button class="back" data-back="home">'+svg('chevron',18)+' 홈</button><strong>'+(isFound?'습득물 등록':'분실물 등록')+'</strong><span style="color:#8299d6;font-size:12px">1 / 1</span></div>'+(state.success?'<div class="success"><div class="check">'+svg('check',36)+'</div><h2>등록이 완료됐어요!</h2><p>시연용 등록이 정상적으로 접수됐어요.<br>실제 서버에 저장되지는 않습니다.</p><button class="primary" data-route="home">홈으로 돌아가기</button></div>':'<h1 class="section-title" style="margin-top:20px">'+(isFound?'어떤 물건을 주웠나요?':'무엇을 잃어버렸나요?')+'</h1><p class="form-intro">종류와 장소·시간을 입력하면 등록 흐름을 확인할 수 있어요.</p><form id="reportForm"><div class="field"><label>물건 종류</label><div class="types">'+['이어폰','지갑','휴대폰','가방','카드','기타'].map(function(x){return '<button type="button" class="type '+(state.type===x?'selected':'')+'" data-type="'+x+'">'+x+'</button>'}).join('')+'</div></div><div class="field"><label for="pic">물건 사진 (선택)</label><input id="pic" type="file" accept="image/*"><div id="preview"></div></div><div class="field"><label for="place">장소</label><input id="place" name="place" placeholder="예: 홍대입구역 8번 출구" required></div><div class="field"><label for="datetime">발견 / 분실 날짜 및 시간</label><input id="datetime" name="datetime" type="datetime-local" required></div><div class="field"><label for="note">특징 (선택)</label><textarea id="note" placeholder="색상, 케이스, 눈에 띄는 특징"></textarea></div><button type="submit" class="primary">'+(isFound?'습득물 등록하기':'분실물 신고하기')+' '+svg('arrow',17)+'</button><p class="footnote">프로토타입 시연용입니다. 작성 내용은 서버에 전송하지 않습니다.</p></form>')+'</section>'}
function savedView(){return status()+'<section class="page"><div class="page-bar"><strong>보관함</strong><button class="circle-btn" data-route="home">'+svg('home',18)+'</button></div><div class="eyebrow">MY LOST LINK</div><h1 class="section-title" style="margin:15px 0">관심 있는 습득물</h1><p class="form-intro">상세 화면에서 저장한 물건을 여기에서 확인할 수 있어요.</p><div class="stack">'+(DATA.filter(function(d){return saved.has(d.id)}).map(row).join('')||'<div class="empty">아직 저장한 습득물이 없어요.<br>발견물 상세 화면에서 ♡ 저장을 눌러 보세요.</div>')+'</div><button class="secondary" data-route="home">최근 발견물 둘러보기</button></section>'}
function syncHash(){var h=decodeURIComponent(location.hash.substring(1));if(h.indexOf('item-')===0){state.page='detail';state.id=Math.min(DATA.length-1,Math.max(0,Number(h.slice(5))||0))}else if(h==='matches'){state.page='matches'}else if(h==='saved'){state.page='saved'}else if(h==='register-lost'){state.page='register';state.mode='lost'}else if(h==='register-found'){state.page='register';state.mode='found'}else{state.page='home'}}
function route(page,id,replace){if(state.page==='home')state.homeScroll=screen.scrollTop;state.page=page;if(typeof id==='number')state.id=id;if(page==='register')state.success=false;var h=page==='home'?'':page==='detail'?'item-'+state.id:page==='register'?'register-'+state.mode:page;var url=location.pathname+location.search+(h?'#'+h:'');if(replace)history.replaceState({},'',url);else history.pushState({},'',url);render()}
function render(){var content=state.page==='detail'?detail(DATA[state.id]):state.page==='matches'?matches():state.page==='register'?register():state.page==='saved'?savedView():home();screen.innerHTML=content;nav();bindPhotos();screen.scrollTop=state.page==='home'?state.homeScroll:0}
function updateSaved(id){if(saved.has(id))saved.delete(id);else saved.add(id);try{localStorage.setItem('lostlink-saved-v1',JSON.stringify([...saved]))}catch(e){}render()}
function sheet(id){var d=DATA[id];overlay.innerHTML='<div class="sheet-wrap" data-dismiss="1"><div class="sheet" role="dialog" aria-modal="true" aria-label="확인 요청"><h3>확인 요청 보내기</h3><p><b>'+escapeHtml(d.name)+'</b>이(가) 내 물건이 맞나요?<br>장소·시간·특징을 확인해 주세요.<br><br>본 기능은 프로토타입이며 실제 습득자에게 전송되지 않습니다.</p><button class="primary" data-confirm="1">확인 요청 보내기</button><button class="secondary" data-close="1">취소</button></div></div>'}
function noticeToast(){overlay.innerHTML='<div class="sheet-wrap" data-dismiss="1"><div class="sheet"><h3>요청을 확인했어요 ✓</h3><p>시연용으로 확인 요청 상태를 표시했습니다.<br>실제 상대방에게 메시지는 전송되지 않습니다.</p><button class="primary" data-close="1">확인</button></div></div>'}
function zoom(d){overlay.innerHTML='<div class="gallery" data-dismiss="1"><img alt="'+escapeHtml(d.name)+' 큰 사진" src="'+escapeHtml(d.image)+'" onerror="this.onerror=null;this.src=\''+fallback(d.shape)+'\'"><button data-close="1">사진 닫기 ✕</button></div>'}
document.addEventListener('click',function(e){var el=e.target.closest('[data-item],[data-filter],[data-form],[data-route],[data-back],[data-nav],[data-type],[data-save],[data-request],[data-close],[data-confirm],[data-zoom],[data-dismiss]');if(!el)return;
if(el.hasAttribute('data-dismiss')&&e.target===el){overlay.innerHTML='';return}
if(el.hasAttribute('data-close')){overlay.innerHTML='';return}
if(el.hasAttribute('data-confirm')){noticeToast();return}
if(el.hasAttribute('data-item')){route('detail',Number(el.dataset.item));return}
if(el.hasAttribute('data-zoom')){zoom(DATA[Number(el.dataset.zoom)]);return}
if(el.hasAttribute('data-request')){sheet(Number(el.dataset.request));return}
if(el.hasAttribute('data-save')){updateSaved(Number(el.dataset.save));return}
if(el.hasAttribute('data-type')){state.type=el.dataset.type;document.querySelectorAll('[data-type]').forEach(function(b){b.classList.toggle('selected',b.dataset.type===state.type)});return}
if(el.hasAttribute('data-filter')){var at=screen.scrollTop;state.filter=el.dataset.filter;render();screen.scrollTop=at;return}
if(el.hasAttribute('data-form')){state.mode=el.dataset.form;route('register');return}
if(el.hasAttribute('data-nav')){if(el.dataset.nav==='register')state.mode='found';route(el.dataset.nav);return}
if(el.hasAttribute('data-route')){route(el.dataset.route);return}
if(el.hasAttribute('data-back')){route('home');return}
});
document.addEventListener('input',function(e){if(e.target.id==='matchSearch'){state.query=e.target.value;var results=DATA.filter(function(d){return !state.query||[d.name,d.where,d.category].join(' ').toLowerCase().indexOf(state.query.toLowerCase())>=0});document.getElementById('matchResults').innerHTML=results.map(row).join('')||'<div class="empty">검색 결과가 없습니다.</div>'}if(e.target.id==='pic'&&e.target.files&&e.target.files[0]){var url=URL.createObjectURL(e.target.files[0]);document.getElementById('preview').innerHTML='<img alt="선택한 사진 미리보기" src="'+url+'" style="width:100%;max-height:180px;object-fit:contain;border-radius:12px;background:#1a2b42">'}});
document.addEventListener('submit',function(e){if(e.target.id==='reportForm'){e.preventDefault();if(!e.target.reportValidity())return;state.success=true;render()}});
window.addEventListener('popstate',function(){syncHash();render()});
document.addEventListener('keydown',function(e){if(e.key==='Escape')overlay.innerHTML=''});
syncHash();render();
})();
</script>
</body>
</html>
