<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0A1020">
<title>LOST LINK · 도로명 주소 검색</title>
<style>
:root{color-scheme:dark;--bg:#0A1020;--panel:#15243E;--line:#324968;--ink:#F7F9FF;--sub:#9FB2D0;--blue:#597BFF;--green:#6BE1B1}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #a3b7ff;outline-offset:2px}.stage{max-width:440px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg)}.header{padding:22px 20px 9px}.header>a{color:var(--sub);text-decoration:none;font-size:13px}.eyebrow{font-weight:800;letter-spacing:.11em;color:#92a9ff;font-size:10px;margin:26px 0 10px}.header h1{font-size:24px;letter-spacing:-.06em;line-height:1.3;margin:0 0 12px}.header p{color:var(--sub);font-size:12px;line-height:1.75;margin:0 0 12px}
.searchbox{padding:0 20px;display:flex;gap:9px}.searchbox input{min-width:0;flex:1;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:15px;color:var(--ink);font-size:13px}.searchbox input::placeholder{color:#8394B0}.searchbox button{border:0;background:var(--blue);color:#fff;padding:0 17px;border-radius:11px;font-size:13px;font-weight:800}.hint{padding:10px 20px;color:#9BACC8;font-size:11px;line-height:1.5}
.chips{display:flex;gap:8px;padding:0 20px 16px;flex-wrap:wrap}.chips button{background:#182742;color:#B3C6E9;border:1px solid var(--line);border-radius:99px;padding:7px 11px;font-size:11px}
.vendor{margin:0 20px;overflow:hidden;flex:1;min-height:320px;background:#FFF;border-radius:12px;color:#1d1d1d;position:relative}.vendor>*{width:100%;height:100%}.vendor>div{min-height:360px}.loading{display:grid;place-items:center;padding:30px;background:var(--panel);font-size:12px;line-height:1.9;color:var(--sub);text-align:center}
.result{margin:14px 20px 0;border:1px solid #41678A;border-radius:13px;background:#152840;padding:17px}.result h2{margin:0 0 13px;font-size:15px}.result .label{color:#8FC9E8;font-size:10px;margin:13px 0 5px}.result .value{font-size:14px;line-height:1.6;word-break:keep-all}.result .minor{font-size:11px;color:var(--sub)}.detail{margin-top:13px;width:100%;background:#0f1b2e;border:1px solid #425A7B;border-radius:10px;color:white;padding:13px;font-size:12px}.detail::placeholder{color:#7890B2}
.actions{padding:17px 20px 27px;display:flex;flex-direction:column;gap:9px}.primary,.secondary{width:100%;border-radius:11px;font-weight:800;font-size:13px;padding:14px;border:0}.primary{background:var(--blue);color:white}.secondary{border:1px solid var(--line);color:#B8C7E2;background:#1A2A45}.primary:disabled{opacity:.4;cursor:not-allowed}.note{font-size:10px;color:#7F91AE;line-height:1.7;text-align:center;margin:12px 4px 0}
.status{padding:12px 20px;font-size:11px;color:#80DDB8;min-height:32px}
@media(min-width:700px){body{background:radial-gradient(ellipse at 30% 15%,#20345d,#070c15 69%)}.stage{border-left:1px solid #253754;border-right:1px solid #253754;box-shadow:0 15px 75px #0006}}
</style>
<script src="https://t1.kakaocdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js" defer></script>
</head><body>
<div class="stage">
<header class="header">
<a href="../" id="back">‹ 뒤로</a><div class="eyebrow">LOST LINK / LOCATION SEARCH</div><h1>도로명 주소 검색</h1><p>전국의 도로명, 건물명, 지번을 검색할 수 있어요.<br>정확한 위치를 찾은 뒤 장소의 세부 특징을 추가해 주세요.</p>
</header>
<form id="search" class="searchbox" role="search"><input id="keyword" type="search" placeholder="예: 테헤란로 152, 홍대입구역, 세종대로" autocomplete="off" aria-label="주소 검색어"><button type="submit">검색</button></form>
<div class="hint">아래에서 실제 도로명 주소 검색 결과를 선택하세요.</div>
<div class="chips"><button type="button" data-q="테헤란로 152">테헤란로 152</button><button type="button" data-q="세종대로 110">세종대로 110</button><button type="button" data-q="부산 해운대로">부산 해운대로</button></div>
<div class="vendor" id="results"><div class="loading" id="loader">전국 주소 검색 기능을 불러오는 중입니다.</div></div>
<section class="result" id="selected" hidden aria-live="polite">
<h2>선택한 주소</h2><div class="label">도로명 주소</div><div id="road" class="value"></div><div class="label">지번 주소</div><div id="jibun" class="minor"></div><div class="label">우편번호</div><div id="zipcode" class="minor"></div>
<input class="detail" id="detail" maxlength="120" placeholder="추가 위치 (선택): 8번 출구 주변, 건물 앞, 2층" aria-label="상세 위치">
</section>
<div class="status" id="status" role="status"></div>
<div class="actions"><button type="button" class="primary" id="apply" disabled>이 주소 선택하기</button><button type="button" class="secondary" id="copy" disabled>주소 복사하기</button><p class="note">검색 결과는 Kakao 우편번호 서비스를 이용합니다.<br>입력 주소는 선택하기 전까지 LOST LINK 서버에 저장되지 않습니다. 본 서비스는 포트폴리오 시연용입니다.</p></div>
</div>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
let active=null,widget=null,tries=0;
const embed=new URLSearchParams(location.search).get('embed')==='1';
if(embed){$('back').hidden=true;document.querySelector('.header h1').textContent='주소 검색';}
function notify(message){$('status').textContent=message;}
function getProvider(){return window.kakao?.Postcode||window.daum?.Postcode;}
function selectedAddress(data){
 const road=data.roadAddress||data.autoRoadAddress||data.address||'';
 const jibun=data.jibunAddress||data.autoJibunAddress||'';
 active={roadAddress:road,postcode:data.zonecode||'',jibunAddress:jibun,sido:data.sido||'',sigungu:data.sigungu||'',bname:data.bname||''};
 $('selected').hidden=false;$('road').textContent=road||'(도로명 주소 없음)';$('jibun').textContent=jibun||'지번 주소 없음';$('zipcode').textContent=data.zonecode||'';
 $('apply').disabled=!road;$('copy').disabled=!road;notify('주소를 선택했어요. 상세 위치를 적고 적용해 주세요.');
 $('selected').scrollIntoView({block:'nearest',behavior:'smooth'});
}
function init(q){
 const P=getProvider();
 if(!P){if(tries++<22){setTimeout(()=>init(q),350);return;} $('results').innerHTML='<div class="loading">주소 검색 서비스를 불러오지 못했습니다.<br>인터넷 연결을 확인한 뒤 새로고침해 주세요.</div>';notify('주소 검색 연결 실패');return;}
 tries=0;$('results').replaceChildren();const target=$('results');
 widget=new P({oncomplete:selectedAddress,width:'100%',height:'100%',onresize:()=>{},theme:{bgColor:'#FFFFFF',searchBgColor:'#F4F6FF',queryTextColor:'#121A2A',postcodeTextColor:'#446BD7'}});
 try{widget.embed(target,{q:q||'',autoClose:false});notify(q?'“'+q+'” 검색 결과':'도로명, 건물명 또는 지번으로 검색해 주세요.');}catch(e){target.innerHTML='<div class="loading">주소 검색 창을 열 수 없어요.</div>';notify('검색 서비스를 다시 실행해 주세요.');}
}
$('search').addEventListener('submit',e=>{e.preventDefault();init($('keyword').value.trim());});
document.querySelectorAll('[data-q]').forEach(b=>b.addEventListener('click',()=>{$('keyword').value=b.dataset.q;init(b.dataset.q)}));
function fullAddress(){return active.roadAddress+($('detail').value.trim()?' · '+$('detail').value.trim():'');}
$('copy').addEventListener('click',async()=>{if(!active)return;try{await navigator.clipboard.writeText(fullAddress());notify('주소를 복사했어요.');}catch(e){notify('자동 복사가 불가능합니다. 주소 텍스트를 선택해 복사해 주세요.');}});
$('apply').addEventListener('click',()=>{if(!active)return;const payload={type:'lostlink:selected-address',address:fullAddress(),roadAddress:active.roadAddress,jibunAddress:active.jibunAddress,postcode:active.postcode,detail:$('detail').value.trim()};
 if(embed&&window.parent!==window){window.parent.postMessage(payload,location.origin);notify('분실 장소에 주소를 적용했어요.');return;}
 try{sessionStorage.setItem('lostlink:selected-address',JSON.stringify(payload));}catch(e){}
 notify('주소를 선택했어요. 이제 이 주소를 앱에 적용하거나 복사할 수 있어요.');
 if(!document.getElementById('return')){const b=document.createElement('button');b.type='button';b.className='primary';b.id='return';b.textContent='LOST LINK 등록 화면으로 돌아가기';b.onclick=()=>location.assign('../#register');document.querySelector('.actions').prepend(b);}
});
window.addEventListener('load',()=>init(''));
})();
</script></body></html>
