name: Enhance original portfolio posters
on:
  push:
    paths:
      - "scripts/enhance-posters.py"
      - ".github/workflows/enhance-posters.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Pillow
        run: python -m pip install pillow==11.3.0
      - name: Increase resolution and minimize image compression
        run: python scripts/enhance-posters.py
      - name: Commit improved images without altering layouts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fashion/assets/submitted/*-poster.webp
          if ! git diff --cached --quiet; then
            git commit -m "Improve six original work posters 2x-3x with high quality encoding"
            git push
          fi
