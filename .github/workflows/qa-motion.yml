name: QA motion portfolio
on:
  push:
    paths:
      - .github/workflows/qa-motion.yml
      - scripts/qa-motion.cjs
      - fashion/motion.js
      - fashion/motion.css
      - fashion/index.html
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test full-motion portfolio and mobile
        run: node scripts/qa-motion.cjs
