name: Crop Figma viewer borders from real videos
on:
  push:
    paths:
      - scripts/crop-figma-videos.cjs
      - .github/workflows/crop-figma-videos.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  crop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Crop and verify video display area
        run: |
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg
          node scripts/crop-figma-videos.cjs
      - name: Commit compact, real Figma recordings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fashion/assets/demos/*-figma.mp4
          if ! git diff --cached --quiet; then
            git commit -m "Crop black Figma player borders from actual interaction recordings"
            git pull --rebase
            git push
          fi
