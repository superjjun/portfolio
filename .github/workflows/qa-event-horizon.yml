name: QA event horizon portfolio
on:
  push:
    paths:
      - .github/workflows/qa-event-horizon.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Chrome for browser QA
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test entrance gate, animated warp, headshot, projects and mobile
        run: node scripts/qa-event-horizon.cjs
