name: Encode real Figma screen recordings for browsers
on:
  push:
    paths:
      - scripts/encode-figma-webm.cjs
      - .github/workflows/encode-figma-webm.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  encode:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Convert genuine MP4 capture to VP9 WebM
        run: |
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg
          node scripts/encode-figma-webm.cjs
      - name: Commit browser-compatible recordings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fashion/assets/demos/*-figma.webm
          if ! git diff --cached --quiet; then
            git commit -m "Add VP9 WebM of actual Figma prototype interactions"
            git pull --rebase
            git push
          fi
