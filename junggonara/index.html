<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="중고나라 리디자인 · 딜 레이더, 상품 검수, 안전결제, 거래 후기 모바일 프로토타입">
<title>중고나라 — deal radar prototype</title>
<style>
:root{--green:#0abd5f;--deep:#028c4d;--ink:#101614;--muted:#939d96;--mint:#f0faf3;--line:#edf0ed}
*{box-sizing:border-box}
body{margin:0;background:#e9edeb;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",Arial,sans-serif}
button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.phone{height:min(844px,100dvh);width:min(390px,100vw);background:#fff;position:relative;overflow:hidden;margin:20px auto;box-shadow:0 18px 50px #1d322326}
.status{position:absolute;z-index:20;top:0;left:0;right:0;height:44px;background:white;display:flex;align-items:center;justify-content:space-between;padding:0 15px 0 29px;font-weight:750;font-size:13px}
.island{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:76px;height:23px;background:#0c1310;border-radius:20px}
.network{display:flex;align-items:center;gap:2px;font:750 10px Arial,sans-serif}
.network svg{display:block}
.header{height:55px;position:absolute;top:44px;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:0 20px;background:#fff;z-index:10}
.logo-btn,.header-btn,.back-btn{border:0;background:none;padding:2px;display:grid;place-items:center;color:var(--ink)}
.header-btn{position:relative}.header-actions{display:flex;gap:14px;align-items:center}
.notice{position:absolute;right:-11px;top:-8px;color:white;background:#f43d55;border-radius:10px;font-size:10px;font-weight:750;padding:3px 4px}
.back-btn{display:flex;gap:14px;align-items:center;font-size:18px;font-weight:800}
.scroll{position:absolute;top:99px;left:0;right:0;bottom:77px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}
.nav{position:absolute;bottom:0;left:0;right:0;height:77px;border-top:1px solid #f0f0f0;background:white;display:flex;z-index:10}
.nav button{width:20%;height:100%;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:5px;padding:11px 0 0;color:#a1aaa4;font-size:10px}
.nav button.active{color:var(--deep);font-weight:800}.nav .sell{padding-top:4px}
.nav .sell-icon{display:grid;place-items:center;width:49px;height:49px;border-radius:50%;background:var(--green);color:#fff}
.svg{display:inline-block;flex:none}
.hero{margin:27px 20px 0;height:247px;background:#020b05;border-radius:12px;position:relative;overflow:hidden;cursor:pointer;color:#fff}
.hero svg.radar{position:absolute;inset:0;width:100%;height:100%}
.hero:after{content:"";height:115px;position:absolute;bottom:0;left:0;right:0;background:linear-gradient(0deg,#010a05 0%,#020e07e3 65%,transparent 100%);pointer-events:none}
.hero-head{position:absolute;top:17px;left:17px;z-index:2;font-size:11px;font-weight:800}
.hero-hours{position:absolute;top:17px;right:17px;z-index:2;font-size:11px;color:#c5e0c7}
.hero-caption{position:absolute;bottom:14px;left:18px;z-index:3}
.hero-caption small{font:bold 11px Arial;color:#12dc70}.hero-caption h1{margin:5px 0 2px;font:bold 40px/1 Arial,sans-serif;letter-spacing:-1.4px}.hero-caption p{font-size:10px;color:#d3ded5;margin:7px 0 0}
.radar-beam{transform-origin:69% 47%;animation:spin 7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.cats{display:grid;grid-template-columns:repeat(6,1fr);padding:19px 18px 0}
.cat{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:15px;min-height:78px;font-size:11px;color:#929b96}
.guide{width:calc(100% - 40px);height:66px;margin:18px 20px 0;display:flex;align-items:center;position:relative;padding:10px 14px;border:0;border-radius:8px;background:#f0f9f1;overflow:hidden;text-align:left}
.guide b{display:block;color:var(--deep);font-size:14px}.guide small{display:block;color:#9baea2;font-size:10px;margin-top:7px}
.guide svg{position:absolute;right:26px;bottom:-2px}.guide .arrow{margin-left:auto;color:#859d8c;font-size:22px;z-index:2}
.section{margin:31px 20px 23px;display:flex;justify-content:space-between;align-items:center}
.section h2{margin:0;font-size:19px;letter-spacing:-.6px}.section button{border:0;background:none;font-size:11px;color:#9da6a0}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin:0 20px}
.product{position:relative;min-width:0}
.product button.open{display:block;padding:0;text-align:left;background:none;border:0;width:100%}
.product img{display:block;width:100%;aspect-ratio:82/107;object-fit:cover;border-radius:7px;background:#f1f3f1}
.product .name{font-size:10px;font-weight:650;line-height:1.35;margin:9px 1px 6px;min-height:27px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.product .price{font-size:11px;font-weight:850;margin:0 1px}.product .sub{font-size:9px;color:#99a29b;margin-top:5px}
.heart-btn{position:absolute;top:5px;right:5px;border:0;background:#ffffffd9;padding:4px;border-radius:50%;display:grid;place-items:center}
.banner{margin:29px 20px 28px;padding:20px 16px;background:var(--mint);border:0;border-radius:8px;width:calc(100% - 40px);display:flex;gap:13px;text-align:left;align-items:center;color:var(--deep)}
.banner strong{font-size:15px}.banner small{font-size:11px;color:#91a897;display:block;margin-top:8px}
.page{padding:22px 20px 45px}.eyebrow{font:800 10px Arial;letter-spacing:1px;color:var(--deep)}.title{font-size:24px;font-weight:850;letter-spacing:-.8px;margin:12px 0 8px}.subtitle{font-size:12px;color:var(--muted);line-height:1.7;margin:0 0 24px}
.pills{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin:17px 0 24px}
.pill{border:1px solid #e5ebe7;background:#f7f9f7;border-radius:17px;padding:8px 12px;white-space:nowrap;font-size:11px;color:#5f6f63}
.pill.on{background:var(--deep);border-color:var(--deep);color:#fff}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:25px 14px}
.grid2 .product img{aspect-ratio:1.05}.grid2 .product .name{font-size:13px;margin-top:11px}.grid2 .product .price{font-size:15px}.grid2 .product .sub{font-size:11px}
.product-hero{width:100%;height:350px;object-fit:cover;display:block}
.detail{padding:22px 20px 110px}.detail h1{font-size:22px;letter-spacing:-.5px;margin:0 0 12px}.detail .big-price{font-size:24px;font-weight:850}
.fine{color:var(--muted);font-size:12px;line-height:1.7}.line{height:1px;background:var(--line);margin:25px 0}
.trust{border:0;border-radius:8px;padding:19px;background:#eef8f0;display:flex;gap:13px;width:100%;align-items:flex-start;text-align:left}
.trust b{color:var(--deep);font-size:15px}.trust small{display:block;color:#92aa9a;font-size:11px;margin-top:9px;line-height:1.6}
.seller-row{display:flex;gap:12px;align-items:center;border:0;background:none;padding:0;text-align:left}.seller-avatar{width:49px;height:49px;background:#e5f5ea;color:#0b8b4e;border-radius:50%;display:grid;place-items:center;font-weight:900}
.fixed{position:absolute;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);height:77px;padding:11px 20px;display:flex;gap:12px;align-items:center;z-index:15}
.primary{background:#028c4d;color:#fff;border:0;border-radius:10px;height:52px;font-weight:800;flex:1;font-size:14px}.outline{border:1px solid #e2eae4;background:#fff;border-radius:10px;height:52px;min-width:55px;padding:0 14px;color:#047f49}
.row{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:16px 0;font-size:13px}.row span{color:#929b94}.row strong{font-size:14px}
.summary{display:flex;gap:13px;background:#f5f8f5;border-radius:9px;padding:12px;align-items:center}.summary img{width:96px;height:110px;object-fit:cover;border-radius:7px}.summary strong{font-size:14px}.summary b{display:block;font-size:17px;margin-top:12px}.summary small{color:#909b93;font-size:11px}
.option{display:flex;gap:13px;align-items:center;text-align:left;border:1px solid #e6eee7;background:#fff;border-radius:10px;padding:19px 15px;width:100%;margin-top:12px}.option.chosen{background:#eff9f1;border-color:#80ca98}
.radio{width:19px;height:19px;border-radius:50%;border:2px solid #9caca0;flex:none}.chosen .radio{border:6px solid #078c4d}.option strong{font-size:14px}.option small{font-size:11px;color:#929c95;line-height:1.6;display:block;margin-top:8px}
.step{display:flex;gap:15px;min-height:81px;position:relative}.step:not(:last-child):before{content:"";position:absolute;left:17px;top:34px;height:45px;border-left:1px solid #d8e9dd}
.step .num{border-radius:50%;background:#eaf7ed;color:var(--deep);display:grid;place-items:center;font:800 11px Arial;width:35px;height:35px;flex:none}
.step:first-child .num{color:white;background:var(--deep)}.step b{font-size:14px}.step small{display:block;color:#919b94;font-size:11px;margin-top:9px}
.stars{display:flex;justify-content:center;gap:4px}.stars button{border:0;background:transparent;font-size:37px;color:#e6b648}
.tags{display:flex;flex-wrap:wrap;gap:9px}.tags button{border:0;border-radius:24px;background:#f3f6f4;padding:10px 15px;color:#6b796d;font-size:12px}.tags button.chosen{background:var(--deep);color:#fff}
.profile{display:flex;gap:14px;align-items:center;background:#f4f8f5;padding:20px;border-radius:10px}
.avatar{width:66px;height:66px;background:#e7f7ea;display:grid;place-items:center;border-radius:50%;color:#048750;font-size:25px;font-weight:850}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:22px 0}.stat{border-radius:8px;background:#f6f8f6;padding:20px 5px;text-align:center}.stat b{display:block;font-size:21px}.stat small{display:block;color:#979f99;font-size:11px;margin-top:10px}
.menu-row{border:0;background:#fff;border-bottom:1px solid var(--line);padding:22px 0;width:100%;display:flex;align-items:center;justify-content:space-between;text-align:left;font-size:14px;font-weight:700}
.success-art{width:158px;height:158px;border-radius:50%;background:#eaf8ee;color:#078a4f;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:60px auto 39px}.success-art .check{font-size:39px;font-weight:800}.success-art b{font-size:28px}
.form-label{font-size:14px;font-weight:750;display:block;margin:21px 0 9px}.field{border:1px solid #e3ece5;background:#f8faf8;border-radius:9px;padding:13px;width:100%;font-size:13px}
@media(min-width:431px){.side-note{position:fixed;left:calc(50% + 225px);top:35px;width:235px;color:#425247;font-size:13px;line-height:1.8}.side-note b{display:block;color:#244333;font-size:17px;margin-bottom:8px}}
@media(max-width:430px){body{background:#fff}.phone{margin:0;height:100dvh;width:100%;box-shadow:none}.side-note{display:none}}
@media(prefers-reduced-motion:reduce){.radar-beam{animation:none}}
</style>
</head>
<body>
<div class="phone" id="app" aria-label="중고나라 모바일 프로토타입"></div>
<aside class="side-note"><b>JUNGGO NARA</b>모바일 웹 프로토타입<br>상품 선택 → 검수 → 안전결제 → 거래 진행 → 후기 작성<br><br>LTE · 배터리 80%<br>실제 결제는 발생하지 않습니다.</aside>
<script>
'use strict';
const catalog=[
{id:'airpods',name:'에어팟 프로 2세대',price:219000,seller:'clean_device',grade:'A',desc:'실사용 기간이 짧고 전체적으로 깨끗합니다. 충전 및 연결 상태 정상입니다. 검수 및 안전결제로 거래 가능합니다.'},
{id:'iphone',name:'아이폰 14 프로 256GB',price:485000,seller:'apple_room',grade:'S',desc:'깨끗하게 사용한 아이폰입니다. 기기 작동과 배터리 상태를 확인했어요. 안전결제와 검수 옵션으로 거래 가능합니다.'},
{id:'chair',name:'원목 디자인 체어',price:86000,seller:'wood_space',grade:'A',desc:'따뜻한 원목 프레임의 디자인 의자입니다. 전체적으로 양호하고 가구 특유의 생활감이 있습니다.'},
{id:'camera',name:'빈티지 필름 카메라',price:109000,seller:'analog_shop',grade:'B',desc:'클래식 필름 카메라입니다. 외관에 사용감이 있어 상태 사진을 확인해 주세요. 안전결제로 거래 가능합니다.'}
];
const state={view:'home',item:'airpods',inspect:true,favorites:new Set(),rating:5,tags:new Set(['설명과 같아요','친절해요']),points:0,filter:'전체'};
const backStack=[],pictures={};
const M=n=>Number(n).toLocaleString('ko-KR')+'원';
function I(name,size=24,color='currentColor'){
const d={home:'<path d="m3 10 9-7 9 7v11h-6v-7H9v7H3z"/>',grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',plus:'<path d="M12 3v18M3 12h18"/>',heart:'<path d="M20.8 5a5.4 5.4 0 0 0-7.6 0L12 6.1 10.8 5a5.4 5.4 0 0 0-7.6 7.7L12 21l8.8-8.3A5.4 5.4 0 0 0 20.8 5z"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3-6.5 8-6.5s8 2.5 8 6.5"/>',search:'<circle cx="10.5" cy="10.5" r="6.8"/><path d="m16 16 5 5"/>',bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 8-3 10h18c0-2-3-3-3-10M10 21h4"/>',shield:'<path d="m12 2 8 4v6c0 5-3 8-8 10-5-2-8-5-8-10V6z"/><path d="m8 12 3 3 5-6"/>',pin:'<path d="M12 22s8-7 8-13a8 8 0 0 0-16 0c0 6 8 13 8 13Z"/><circle cx="12" cy="9" r="2"/>',flame:'<path d="M12 3c0 6-7 8-7 13a7 7 0 1 0 14 0c0-4-2-7-4-9 0 4-2 5-3 5 1-4 0-6 0-9Z"/>',back:'<path d="m15 4-8 8 8 8"/>',right:'<path d="m9 4 8 8-8 8"/>'};
return '<svg class="svg" width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="'+color+'" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(d[name]||d.grid)+'</svg>';
}
function photo(k){return pictures[k]||'';}
function item(){return catalog.find(x=>x.id===state.item)||catalog[0]}
function logo(){return '<svg width="37" height="37" viewBox="0 0 48 48"><path d="M30 3h14v28c0 9-6 14-15 14H16C8 45 4 40 4 32V21h14v12h8c3 0 4-2 4-5V3Z" fill="#0cbb5c"/><path d="M21 17h9v16h-9z" fill="#fff"/></svg>'}
function status(){return '<div class="status"><span>9:41</span><div class="island"></div><div class="network" aria-label="LTE 신호, 배터리 80%"><svg width="18" height="18" viewBox="0 0 18 18"><g fill="#101614"><rect y="13" width="3" height="4" rx=".7"/><rect x="4.5" y="10" width="3" height="7" rx=".7"/><rect x="9" y="7" width="3" height="10" rx=".7"/><rect x="13.5" y="4" width="3" height="13" rx=".7"/></g></svg><span>LTE</span><svg width="29" height="18" viewBox="0 0 28 18"><rect x="1" y="3.1" width="22.4" height="11.8" rx="3" stroke="#101614" fill="none" stroke-width="1.6"/><rect x="3.5" y="5.6" width="16.5" height="6.9" rx="1.4" fill="#101614"/><path d="M25 7q2 1.2 0 4z" fill="#101614"/></svg></div></div>'}
function header(){const main=['home','radar','category','saved','my','search'].includes(state.view);return '<header class="header">'+(main?'<button class="logo-btn" data-go="home" aria-label="홈">'+logo()+'</button><div class="header-actions"><button class="header-btn" data-go="my" aria-label="알림">'+I('bell')+'<span class="notice">9+</span></button><button class="header-btn" data-go="search" aria-label="검색">'+I('search')+'</button></div>':'<button class="back-btn" data-back="1">'+I('back')+'<span>'+({detail:'상품 상세',inspect:'상품 검수',pay:'안전결제',order:'거래 진행',review:'거래 후기',success:'포인트 적립',sell:'판매 등록'}[state.view]||'중고나라')+'</span></button>')+'</header>'}
function navigation(){if(!['home','radar','category','saved','my','search'].includes(state.view))return '';return '<nav class="nav">'+[['home','홈','home'],['category','카테고리','grid'],['sell','판매하기','plus'],['saved','찜','heart'],['my','마이','user']].map(x=>'<button class="'+(state.view===x[0]?'active ':'')+(x[0]==='sell'?'sell':'')+'" data-go="'+x[0]+'">'+(x[0]==='sell'?'<span class="sell-icon">'+I('plus',29,'#fff')+'</span>':I(x[2]))+'<span>'+x[1]+'</span></button>').join('')+'</nav>'}
function radarSVG(){return '<svg class="radar" viewBox="0 0 350 250" preserveAspectRatio="xMidYMid slice"><defs><radialGradient id="grad" cx="73%" cy="47%" r="55%"><stop stop-color="#0b3c1b"/><stop offset=".7" stop-color="#07180d"/><stop offset="1" stop-color="#020a05"/></radialGradient><linearGradient id="beam"><stop stop-color="#7dff51" stop-opacity="0"/><stop offset="1" stop-color="#8fff5e" stop-opacity=".36"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="3"/></filter></defs><rect width="350" height="250" fill="url(#grad)"/><g fill="none" stroke="#28612d" stroke-opacity=".5" transform="translate(239 117)">'+[29,50,72,96,123,148,174].map(r=>'<circle r="'+r+'"/>').join('')+'</g><g class="radar-beam"><path d="M239 117 338 -2 A150 150 0 0 1 347 130Z" fill="url(#beam)"/><path d="M239 117 335 -1" stroke="#7aff41" stroke-width="8" stroke-opacity=".4" filter="url(#glow)"/><path d="M239 117 335 -1" stroke="#7fff46" stroke-width="2.3"/></g><circle cx="239" cy="117" r="3" fill="#5cff41"/><circle cx="335" cy="6" r="4" fill="#beff7d"/><g fill="none" stroke="#4b9d39" stroke-width="2" opacity=".5"><rect x="109" y="50" width="13" height="14" rx="2"/><path d="M101 136h22l4-9 8 9h17v6h-51z"/><rect x="278" y="78" width="13" height="17"/><rect x="302" y="170" width="22" height="13"/></g></svg>'}
function radarCard(){return '<div class="hero" role="button" tabindex="0" data-go="radar">'+radarSVG()+'<div class="hero-head">중고나라</div><div class="hero-hours">24h</div><div class="hero-caption"><small>NEW</small><h1>deal radar</h1><p>지금 뜨는 거래를 실시간으로 포착해요.</p></div></div>'}
function cats(){return '<div class="cats">'+[['전체','grid','#088a50','category'],['인기','flame','#fb7153','radar'],['안전거래','shield','#367dff','inspect'],['직거래','pin','#018e49','category'],['찜','heart','#ff4e79','saved'],['내주변','pin','#8b60ff','category']].map(x=>'<button class="cat" data-go="'+x[3]+'">'+I(x[1],24,x[2])+'<span>'+x[0]+'</span></button>').join('')+'</div>'}
function mascot(){return '<svg width="73" height="66" viewBox="0 0 80 72"><path d="M40 14C25 0 17 8 17 18 5 27 12 48 28 53l-4 16h31l-4-17c23-10 17-39-2-40-4-7-7-6-9 2Z" fill="#66d847"/><path d="M26 36q7 8 14 1" stroke="#267d3c" stroke-width="2.5" fill="none" stroke-linecap="round"/><circle cx="23" cy="28" r="2.2" fill="#1e7136"/><circle cx="44" cy="27" r="2.2" fill="#1e7136"/></svg>'}
function section(t,d){return '<div class="section"><h2>'+t+'</h2><button data-go="'+d+'">더보기 ›</button></div>'}
function card(d){return '<article class="product"><button class="heart-btn" data-fav="'+d.id+'" aria-label="찜">'+I('heart',15,state.favorites.has(d.id)?'#f65478':'#a7b0a9')+'</button><button class="open" data-product="'+d.id+'"><img loading="lazy" src="'+photo(d.id)+'" alt="'+d.name+'"><div class="name">'+d.name+'</div><div class="price">'+M(d.price)+'</div><div class="sub">안전결제 · 검수 가능</div></button></article>'}
function home(){return radarCard()+cats()+'<button class="guide" data-go="inspect"><span><b>중고나라 가이드</b><small>안전한 거래를 위한 핵심 기능을 확인해요</small></span>'+mascot()+'<span class="arrow">›</span></button>'+section('최근 본 상품','category')+'<div class="grid4">'+catalog.map(card).join('')+'</div>'+section('지금 인기 상품','radar')+'<div class="grid4">'+[...catalog].reverse().map(card).join('')+'</div><button class="banner" data-go="inspect">'+I('shield',33,'#078c4d')+'<span><strong>안전결제부터 검수까지</strong><small>검수 · 구매확정 · 거래 후기</small></span></button>'}
function grid2(arr){return '<div class="grid2">'+(arr.length?arr.map(card).join(''):'<p style="font-size:13px;color:#949e96">찜한 상품이 없습니다.</p>')+'</div>'}
function category(){return '<div class="page"><div class="eyebrow">ALL CATEGORIES</div><h1 class="title">카테고리</h1><p class="subtitle">관심 있는 물건을 빠르게 찾아보세요.</p><div class="pills">'+['전체','디지털·가전','가구·인테리어','안전거래'].map(x=>'<button class="pill '+(state.filter===x?'on':'')+'" data-filter="'+x+'">'+x+'</button>').join('')+'</div>'+grid2(state.filter==='가구·인테리어'?catalog.filter(x=>x.id==='chair'):state.filter==='디지털·가전'?catalog.filter(x=>x.id!=='chair'):catalog)+'</div>'}
function radar(){return '<div class="page"><div class="eyebrow">DEAL RADAR / LIVE</div><h1 class="title">나만의 딜 레이더</h1><p class="subtitle">내 취향에 가까운 거래를 찾는 새로운 방법.</p></div>'+radarCard()+'<div class="page"><div class="pills"><span class="pill on">내 주변 10km</span><span class="pill">안전결제</span><span class="pill">실시간 추천</span></div><h2 style="font-size:18px;margin:0 0 22px">방금 포착한 상품</h2>'+grid2(catalog)+'</div>'}
function saved(){return '<div class="page"><h1 class="title">찜한 상품</h1><p class="subtitle">다시 보고 싶은 상품을 모아 보세요.</p>'+grid2(catalog.filter(x=>state.favorites.has(x.id)))+'</div>'}
function my(){return '<div class="page"><div class="eyebrow">MY JUNGGO NARA</div><h1 class="title">나의 중고나라</h1><div class="profile"><span class="avatar">J</span><span><b>junseo.archive</b><p class="subtitle" style="margin:8px 0 0">안전한 거래를 이어가는 중</p></span></div><div class="stats"><div class="stat"><b>12</b><small>거래 완료</small></div><div class="stat"><b>4.9</b><small>후기 평점</small></div><div class="stat"><b>'+state.points+'P</b><small>포인트</small></div></div><h3 style="font-size:17px;margin-top:36px">나의 거래 관리</h3>'+[['안전결제 내역','order'],['검수 진행 현황','inspect'],['거래 후기 작성','review'],['관심상품','saved']].map(x=>'<button class="menu-row" data-go="'+x[1]+'">'+x[0]+I('right',20,'#929b94')+'</button>').join('')+'</div>'}
function detail(){const d=item();return '<img class="product-hero" src="'+photo(d.id)+'" alt="'+d.name+'"><div class="detail"><h1>'+d.name+'</h1><div class="big-price">'+M(d.price)+'</div><p class="fine">상품 상태 '+d.grade+' · 서울 · 안전결제 가능</p><div class="line"></div><button class="trust" data-go="inspect">'+I('shield',27,'#078f4b')+'<span><b>검수 서비스 선택 가능</b><small>거래 전에 상품 상태를 확인할 수 있어요.</small></span></button><div class="line"></div><button class="seller-row" data-go="review"><span class="seller-avatar">'+d.seller[0].toUpperCase()+'</span><span><b style="font-size:14px">후기 좋은 판매자 · '+d.seller+'</b><small style="display:block;font-size:11px;color:#959f97;margin-top:8px">거래 완료 108건 · 후기 평점 4.9점</small></span></button><div class="line"></div><h3 style="font-size:16px">상세 설명</h3><p class="fine" style="font-size:13px;color:#505d53">'+d.desc+'</p></div>'}
function inspect(){return '<div class="page"><div class="eyebrow">JUNGGO INSPECTION</div><h1 class="title">선택형 상품 검수</h1><p class="subtitle">안심 거래를 위해 선택할 수 있어요.</p><button class="option '+(state.inspect?'chosen':'')+'" data-inspect="true"><span class="radio"></span><span><strong>검수 서비스 추가 · +4,900원</strong><small>외관·기본 기능·구성품 확인</small></span></button><button class="option '+(!state.inspect?'chosen':'')+'" data-inspect="false"><span class="radio"></span><span><strong>검수 없이 안전결제</strong><small>판매자가 구매자에게 직접 배송</small></span></button><h3 style="font-size:17px;margin:35px 0 25px">검수 진행 단계</h3>'+steps([['판매자 검수센터 발송','판매자가 검수센터로 상품 발송'],['상품 상태 확인','주요 항목 및 구성품 확인'],['검수 결과 안내','결과 확인 후 안내'],['구매자 배송','검수 완료 후 배송']])+'</div>'}
function steps(data){return data.map((x,i)=>'<div class="step"><span class="num">'+String(i+1).padStart(2,'0')+'</span><span><b>'+x[0]+'</b><small>'+x[1]+'</small></span></div>').join('')}
function total(){return item().price+(state.inspect?4900:0)+3000}
function summary(){const d=item();return '<div class="summary"><img src="'+photo(d.id)+'" alt=""><span><strong>'+d.name+'</strong><b>'+M(d.price)+'</b><small>상품 상태 '+d.grade+' · 안전결제</small></span></div>'}
function pay(){return '<div class="page"><h1 class="title">안전결제</h1><p class="subtitle">구매확정 전까지 결제금이 보관돼요.</p>'+summary()+'<h3 style="margin-top:37px">결제 내역</h3>'+[['상품 금액',M(item().price)],['검수 서비스',M(state.inspect?4900:0)],['배송비','3,000원']].map(x=>'<div class="row"><span>'+x[0]+'</span><strong>'+x[1]+'</strong></div>').join('')+'<div class="row"><strong>총 결제금액</strong><strong style="font-size:23px">'+M(total())+'</strong></div><div class="trust" style="margin-top:33px">'+I('shield',28,'#078c4d')+'<span><b>중고나라 안전결제</b><small>구매확정 전까지 결제금을 안전하게 보관합니다.</small></span></div><p class="fine" style="margin-top:25px">* 실제 결제가 발생하지 않는 프로토타입입니다.</p></div>'}
function order(){return '<div class="page"><div style="text-align:center;font-size:58px;color:#078c4d;margin:30px">✓</div><h1 class="title" style="text-align:center">안전결제가 완료됐어요!</h1><p class="subtitle" style="text-align:center;margin-bottom:36px">결제금은 구매확정 전까지 안전하게 보관돼요.</p>'+summary()+'<h3 style="font-size:17px;margin:34px 0 24px">거래 진행 현황</h3>'+steps([['결제 완료','결제금 보관 중'],['상품 검수',state.inspect?'검수센터 확인 예정':'검수 미선택'],['배송 시작','상품 배송 시작'],['구매 확정','상품 수령 후 완료']])+'</div>'}
function review(){return '<div class="page"><div class="eyebrow">AFTER THE DEAL</div><h1 class="title">좋은 거래였나요?</h1><p class="subtitle">거래 후기가 다음 거래의 신뢰가 돼요.</p>'+summary()+'<h3 style="font-size:16px;margin-top:35px">거래 만족도</h3><div class="stars">'+[1,2,3,4,5].map(n=>'<button data-rating="'+n+'">'+(n<=state.rating?'★':'☆')+'</button>').join('')+'</div><h3 style="font-size:16px;margin:28px 0 16px">좋았던 점을 선택해주세요.</h3><div class="tags">'+['설명과 같아요','친절해요','배송이 빨라요','포장이 꼼꼼해요'].map(x=>'<button class="'+(state.tags.has(x)?'chosen':'')+'" data-tag="'+x+'">'+x+'</button>').join('')+'</div><h3 style="font-size:16px;margin-top:32px">후기 남기기</h3><textarea class="field" style="height:130px" id="review-txt">상품 상태가 설명과 같았고 안전결제로 안심할 수 있었어요.</textarea><div class="trust" style="margin-top:27px"><span><b>후기 작성 시 +500P</b><small>후기를 등록하고 포인트를 받으세요.</small></span></div></div>'}
function success(){return '<div class="page" style="text-align:center"><div class="success-art"><span class="check">✓</span><b>500P</b></div><h1 class="title">후기가 등록됐어요!</h1><p class="subtitle" style="margin-top:18px">좋은 거래 후기를 남겨주셔서 감사합니다.<br>다음 안전결제에서 사용할 수 있는<br>500포인트가 적립됐어요.</p><div class="trust" style="text-align:left;margin-top:60px"><span><b>이번 거래 적립</b><small style="font-size:20px;color:#078c4d;font-weight:800">+500P</small></span></div><button class="outline" style="width:100%;margin-top:18px" data-go="home">홈으로 돌아가기</button></div>'}
function search(){return '<div class="page"><h1 class="title">상품 검색</h1><input id="search" class="field" type="search" placeholder="어떤 상품을 찾으세요?"><div id="results" style="margin-top:20px">'+grid2(catalog)+'</div></div>'}
function sell(){return '<div class="page"><h1 class="title">내 물건 판매하기</h1><p class="subtitle">상품 정보를 입력해 판매 화면을 미리 확인하세요.</p><form id="sale"><label class="form-label">상품명<input class="field" required placeholder="상품명을 입력하세요"></label><label class="form-label">판매 가격<input class="field" required type="number" min="1" placeholder="가격을 입력하세요"></label><label class="form-label">상품 설명<textarea class="field" style="height:125px" placeholder="상태 및 거래 방식"></textarea></label><div class="trust" style="margin-top:25px">'+I('shield',26,'#078c4d')+'<span><b>안전결제 적용</b><small>실제 등록이 발생하지 않는 체험용 폼입니다.</small></span></div><button class="primary" style="width:100%;margin-top:15px">판매 등록 미리보기</button><p class="fine" id="sale-msg"></p></form></div>'}
function content(){return ({home,category,radar,saved,my,detail,inspect,pay,order,review,success,search,sell}[state.view]||home)()}
function footer(){if(['home','radar','category','saved','my','search','sell'].includes(state.view))return '';if(state.view==='detail')return '<div class="fixed"><button class="outline" data-fav="'+state.item+'">'+I('heart',22)+'</button><button class="primary" data-go="inspect">안전결제로 구매</button></div>';const b={inspect:['검수 선택하고 계속','pay'],pay:[M(total())+' 안전결제','order'],order:['구매확정 후 후기 작성','review'],review:['후기 작성 완료 · 500P 받기','success'],success:['내 포인트 확인하기','my']}[state.view];return b?'<div class="fixed"><button class="primary" data-go="'+b[1]+'">'+b[0]+'</button></div>':''}
function render(){document.getElementById('app').innerHTML=status()+header()+'<main class="scroll" id="scroll">'+content()+'</main>'+navigation()+footer();const s=document.getElementById('scroll');if(s)s.scrollTop=0;if(state.view==='search'){document.getElementById('search').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();document.getElementById('results').innerHTML=grid2(catalog.filter(d=>d.name.toLowerCase().includes(q)))});}if(state.view==='sell'){document.getElementById('sale').addEventListener('submit',e=>{e.preventDefault();document.getElementById('sale-msg').textContent='입력 내용을 확인했어요. 실제 상품은 등록되지 않았습니다.'})}}
function go(v,id){if(id){state.item=id;state.inspect=true;}if(v==='success'&&state.view==='review'){state.points+=500;}backStack.push(state.view);state.view=v;location.hash=v;render()}
function back(){state.view=backStack.pop()||'home';location.hash=state.view;render()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-go],[data-product],[data-back],[data-fav],[data-inspect],[data-filter],[data-rating],[data-tag]');if(!b)return;if(b.dataset.product){go('detail',b.dataset.product)}else if(b.dataset.back){back()}else if(b.dataset.fav){const v=b.dataset.fav;state.favorites.has(v)?state.favorites.delete(v):state.favorites.add(v);render()}else if(b.dataset.inspect){state.inspect=b.dataset.inspect==='true';render()}else if(b.dataset.filter){state.filter=b.dataset.filter;render()}else if(b.dataset.rating){state.rating=Number(b.dataset.rating);render()}else if(b.dataset.tag){const v=b.dataset.tag;state.tags.has(v)?state.tags.delete(v):state.tags.add(v);render()}else if(b.dataset.go){go(b.dataset.go)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')back();if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('hero'))go('radar')});
async function boot(){await Promise.all(catalog.map(async x=>{try{const r=await fetch('./images/'+x.id+'.b64');if(!r.ok)throw Error('image '+x.id);pictures[x.id]='data:image/jpeg;base64,'+(await r.text()).trim();}catch(err){console.warn('photo unavailable',x.id,err);}}));render();}
const start=location.hash.replace('#','');if(['home','radar','category','saved','my','search'].includes(start))state.view=start;boot();
</script>
</body></html>
